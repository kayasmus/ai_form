<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Form Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { margin-bottom: 1rem; font-size: 1.5rem; color: #1D9E75; }
    #container { position: relative; width: 640px; }
    #output { width: 640px; height: 480px; border-radius: 8px; display: block; background: #111; }
    #btn { margin-top: 1rem; padding: 12px 32px; background: #1D9E75; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    #btn:hover { background: #17856a; }
    #status { margin-top: 0.5rem; font-size: 0.85rem; color: #888; }
    video, canvas { display: none; }
  </style>
</head>
<body>
  <h1>AI Form Analyzer — Lateral Raise</h1>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="output" width="640" height="480" alt="Waiting for feed..."/>
  </div>
  <button id="btn" onclick="startAnalyzer()">Start Analyzer</button>
  <div id="status">Stand side-on to the camera for best results</div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const img = document.getElementById('output');
    const status = document.getElementById('status');
    let analyzing = false;
    let intervalId = null;

    async function startAnalyzer() {
        if (analyzing) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            canvas.width = 640;
            canvas.height = 480;
            analyzing = true;
            document.getElementById('btn').textContent = 'Analyzing...';
            document.getElementById('btn').disabled = true;
            status.textContent = 'Analyzing — stand side-on for best results';
            intervalId = setInterval(sendFrame, 500);
        } catch(e) {
            status.textContent = 'Camera access denied: ' + e.message;
        }
    }

    async function sendFrame() {
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(async (blob) => {
            const form = new FormData();
            form.append('file', blob, 'frame.jpg');
            try {
                const res = await fetch('http://localhost:8000/annotated', {
                    method: 'POST',
                    body: form
                });
                const blob_resp = await res.blob();
                const url = URL.createObjectURL(blob_resp);
                img.src = url;
            } catch(e) {
                status.textContent = 'Error connecting to server';
            }
        }, 'image/jpeg', 0.8);
    }
  </script>
</body>
</html>
